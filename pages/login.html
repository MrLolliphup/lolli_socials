<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login — Lolli Socials</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body class="auth-body">

    <main class="auth-page">

        <div class="auth-brand">
            <a href="../index.html" class="logo">
                <span class="logo-icon">LS</span>
                <span>Lolli<span>Socials</span></span>
            </a>
        </div>

        <div class="auth-card">

            <div class="auth-heading">
                <span>WELCOME BACK</span>
                <h1>Login to your account</h1>
                <p>Access your Lolli Socials dashboard.</p>
            </div>

            <form class="auth-form">

                <div class="form-group">
                    <label>Email Address</label>
                    <input
                        type="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>

                <div class="form-group">

                    <div class="label-row">
                        <label>Password</label>
                        <a href="#">Forgot password?</a>
                    </div>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <label class="remember">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>

                <button type="submit" class="auth-btn">
                    Login
                </button>

            </form>

            <div class="auth-divider">
                <span>OR</span>
            </div>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create one</a>
            </p>

        </div>

        <p class="auth-footer">
            © 2026 Lolli Socials. All rights reserved.
        </p>

    </main>

</body>
</html>
